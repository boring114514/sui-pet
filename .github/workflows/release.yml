name: Build Release (APK + EXE)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
      options: --user root
    env:
      ANDROID_PROJECT: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build APK
        working-directory: android
        run: |
          yes | buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: monkeypet-apk
          path: android/bin/*.apk
          if-no-files-found: error

  build-exe:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller and Pillow
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow

      - name: Build EXE
        working-directory: desktop
        run: |
          pyinstaller --noconfirm --onefile --noconsole --name DesktopPet `
            --add-data "character.png;." `
            --add-data "pose_idle.png;." `
            --add-data "pose_crawl.png;." `
            --add-data "pose_jump.png;." `
            --add-data "pose_land.png;." main.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: monkeypet-exe
          path: desktop/dist/DesktopPet.exe
          if-no-files-found: error

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-apk, build-exe]
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: monkeypet-apk
          path: release-assets

      - name: Download EXE
        uses: actions/download-artifact@v4
        with:
          name: monkeypet-exe
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/**/*.apk
            release-assets/**/*.exe
          generate_release_notes: true